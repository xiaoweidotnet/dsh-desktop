<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSeek Harness</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101217;
      --panel: #171a21;
      --text: #f3f5f8;
      --muted: #8d96a5;
      --line: #2a303b;
      --accent: #76a7ff;
      --danger: #ff9d9d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 18%, #202c44 0, var(--bg) 48%);
      color: var(--text);
      font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(620px, calc(100vw - 48px));
      padding: 42px;
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 28px 80px rgb(0 0 0 / 28%);
      animation: rise 420ms ease-out both;
    }
    .eyebrow { margin: 0 0 12px; color: var(--accent); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(29px, 5vw, 42px); letter-spacing: -.04em; line-height: 1.08; }
    .lead { max-width: 460px; margin: 18px 0 32px; color: var(--muted); }
    .status { display: flex; align-items: center; gap: 12px; min-height: 32px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 6px rgb(118 167 255 / 12%); }
    .dot.error { background: var(--danger); box-shadow: 0 0 0 6px rgb(255 157 157 / 12%); }
    .detail { margin: 22px 0 0; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
    button { border: 0; border-radius: 10px; padding: 10px 15px; color: #0c1424; background: var(--accent); font: inherit; cursor: pointer; }
    button.secondary { color: var(--text); background: #252b36; }
    button:hover { filter: brightness(1.08); }
    [hidden] { display: none; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">DeepSeek Harness</p>
    <h1>正在准备你的本地智能工作区</h1>
    <p class="lead">桌面应用正在启动上游 Harness。数据保存在本机，浏览器和 Node.js 都不需要额外安装。</p>
    <div class="status"><span id="dot" class="dot"></span><span id="message">正在读取设置…</span></div>
    <p id="detail" class="detail"></p>
    <div id="actions" class="actions" hidden>
      <button id="retry">重新启动</button>
      <button id="workspace" class="secondary">选择工作区</button>
      <button id="logs" class="secondary">打开日志</button>
    </div>
  </main>
  <script type="module">
    const message = document.querySelector('#message')
    const detail = document.querySelector('#detail')
    const dot = document.querySelector('#dot')
    const actions = document.querySelector('#actions')
    const setInfo = async () => {
      const info = await window.dshDesktop.getInfo()
      detail.textContent = `工作区：${info.workspaceDir}`
    }
    const show = (payload) => {
      message.textContent = payload.message
      if (payload.workspaceDir) detail.textContent = `工作区：${payload.workspaceDir}`
      dot.classList.toggle('error', payload.kind === 'error')
      actions.hidden = payload.kind !== 'error'
    }
    document.querySelector('#retry').addEventListener('click', () => window.dshDesktop.retry())
    document.querySelector('#workspace').addEventListener('click', () => window.dshDesktop.chooseWorkspace())
    document.querySelector('#logs').addEventListener('click', () => window.dshDesktop.openLogs())
    window.dshDesktop.onStatus(show)
    setInfo().catch(() => {})
  </script>
</body>
</html>
