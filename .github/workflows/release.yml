name: Release desktop application

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: macos-14
            target: '--mac --arm64'
            signing: mac
          - os: macos-14
            target: '--mac --x64'
            signing: mac
          - os: windows-2022
            target: '--win --x64'
            signing: windows
          - os: windows-2022
            target: '--win --arm64'
            signing: windows
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Set the repository variable RELEASE_SIGNING=true after adding the
      # platform certificate and notarization secrets. Without it, the same
      # artifacts are built unsigned and remain clearly marked as unsigned.
      RELEASE_SIGNING: ${{ vars.RELEASE_SIGNING == 'true' }}
      # An empty CSC_LINK is interpreted by electron-builder as the current
      # directory. Disable identity discovery unless signing is explicitly on;
      # signing variables are injected only in that mode below.
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ vars.RELEASE_SIGNING == 'true' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm
      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile
      - name: Check the published Harness runtime pin
        run: pnpm check:harness
      - name: Verify before release
        run: |
          pnpm verify
          pnpm test
          pnpm smoke:harness
      - name: Configure signing environment
        if: vars.RELEASE_SIGNING == 'true'
        shell: bash
        env:
          RELEASE_CSC_LINK: ${{ matrix.signing == 'mac' && secrets.MAC_CERTIFICATE_BASE64 || '' }}
          RELEASE_CSC_KEY_PASSWORD: ${{ matrix.signing == 'mac' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          RELEASE_WIN_CSC_LINK: ${{ matrix.signing == 'windows' && secrets.WINDOWS_CERTIFICATE_BASE64 || '' }}
          RELEASE_WIN_CSC_KEY_PASSWORD: ${{ matrix.signing == 'windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          RELEASE_APPLE_ID: ${{ matrix.signing == 'mac' && secrets.APPLE_ID || '' }}
          RELEASE_APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.signing == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          RELEASE_APPLE_TEAM_ID: ${{ matrix.signing == 'mac' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          {
            echo "CSC_LINK=$RELEASE_CSC_LINK"
            echo "CSC_KEY_PASSWORD=$RELEASE_CSC_KEY_PASSWORD"
            echo "WIN_CSC_LINK=$RELEASE_WIN_CSC_LINK"
            echo "WIN_CSC_KEY_PASSWORD=$RELEASE_WIN_CSC_KEY_PASSWORD"
            echo "APPLE_ID=$RELEASE_APPLE_ID"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$RELEASE_APPLE_APP_SPECIFIC_PASSWORD"
            echo "APPLE_TEAM_ID=$RELEASE_APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"
      - name: Verify release credentials when signing is enabled
        if: vars.RELEASE_SIGNING == 'true'
        run: node scripts/verify-release-env.mjs ${{ matrix.signing }}
      - name: Build release bundle before publishing
        shell: bash
        run: pnpm exec electron-builder --config electron-builder.config.cjs ${{ matrix.target }} --publish never
      - name: Verify production bundle boundary
        run: pnpm verify:bundle
      - name: Publish release assets
        shell: bash
        run: pnpm exec electron-builder --config electron-builder.config.cjs ${{ matrix.target }} --publish always
