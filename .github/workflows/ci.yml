name: Desktop CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macOS ARM64
          - os: macos-15-intel
            platform: macOS x64
          - os: windows-2022
            platform: Windows x64/ARM64
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check the published Harness runtime pin
        run: pnpm check:harness
      - name: Verify project
        run: pnpm verify
      - name: Run tests
        run: pnpm test
      - name: Start the real Harness Web server
        run: pnpm smoke:harness
      - name: Build unpacked desktop app
        if: matrix.platform == 'Windows x64/ARM64'
        run: pnpm dist:win
      - name: Smoke test the packaged Windows runtime
        if: matrix.platform == 'Windows x64/ARM64'
        run: pnpm smoke:packaged -- dist/win-unpacked
      - name: Invoke the Windows PowerShell host
        if: matrix.platform == 'Windows x64/ARM64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = & pwsh -NoLogo -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()'
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace(($version -join ''))) {
            throw 'PowerShell was not available to the packaged Harness test host.'
          }
          Write-Host "PowerShell $($version -join '') is available."
      - name: Build Windows ARM64 unpacked desktop app
        if: matrix.platform == 'Windows x64/ARM64'
        run: pnpm dist:win:arm64
      - name: Build unpacked macOS ARM64 app
        if: matrix.platform == 'macOS ARM64'
        run: pnpm dist:dir
      - name: Smoke test the packaged macOS ARM64 runtime
        if: matrix.platform == 'macOS ARM64'
        run: pnpm smoke:packaged -- dist/mac-arm64
      - name: Build macOS x64 unpacked desktop app
        if: matrix.platform == 'macOS x64'
        run: pnpm dist:dir:mac:x64
      - name: Smoke test the packaged macOS x64 runtime
        if: matrix.platform == 'macOS x64'
        run: pnpm smoke:packaged -- dist/mac --x64
      - name: Verify production bundle boundary
        run: pnpm verify:bundle
